<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cf5">
<title>Our Chat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Chat">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f0fb; --surface:#ffffff; --text:#1d1b2e; --muted:#7b7894; --line:#e6e2f5;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#5b8def 100%);
  --mine-text:#ffffff; --theirs:#ffffff; --theirs-text:#1d1b2e;
  --accent:#7c5cf5; --green:#22c55e; --danger:#e5484d; --shadow:0 1px 3px rgba(60,40,140,.12);
}
:root[data-theme="dark"]{
  --bg:#0c0d17; --surface:#141626; --text:#ecebf7; --muted:#8c8aa8; --line:#252845;
  --theirs:#1f2238; --theirs-text:#ecebf7; --accent:#8b7cff; --danger:#ff6b70; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15.5px;overflow:hidden;touch-action:manipulation}
button,input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* Login & lock */
#lock{height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:400px;margin:0 auto}
#lock{position:fixed;inset:0;max-width:none;align-items:center;background:var(--bg);z-index:100}
#lock>*{width:100%;max-width:340px}
#lock h1{font-size:30px;font-weight:600;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
#lock p{color:var(--muted);margin-bottom:24px}
.field{width:100%;padding:14px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;outline:none}
.field:focus{border-color:var(--accent)}
.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--grad);color:#fff;font-weight:600;cursor:pointer}
.primary:disabled{opacity:.6}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-bottom:10px}

/* Premium login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;
  background:radial-gradient(900px 500px at 0% 0%,rgba(139,92,246,.28),transparent 60%),radial-gradient(900px 500px at 100% 100%,rgba(91,141,239,.28),transparent 60%),var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;animation:flt 12s ease-in-out infinite;pointer-events:none}
.o1{width:260px;height:260px;background:#8b5cf6;top:-70px;left:-70px}
.o2{width:300px;height:300px;background:#5b8def;bottom:-90px;right:-90px;animation-delay:-5s}
@keyframes flt{50%{transform:translate(30px,25px) scale(1.08)}}
.lcard{position:relative;width:100%;max-width:380px;padding:30px 22px 20px;border-radius:28px;background:rgba(255,255,255,.74);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.6);box-shadow:0 24px 60px rgba(60,40,140,.25);animation:rise .6s ease both}
:root[data-theme="dark"] .lcard{background:rgba(20,22,38,.72);border-color:rgba(255,255,255,.08)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logo{width:66px;height:66px;border-radius:21px;background:var(--grad);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(124,92,245,.45)}
.logo svg{width:36px;height:36px}
.lcard h1{font-size:26px;font-weight:600;text-align:center;margin-bottom:4px}
.lcard .sub{color:var(--muted);text-align:center;margin-bottom:24px;font-size:14.5px}
.inp{display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;height:52px;border:1px solid var(--line);background:var(--surface);border-radius:14px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,92,245,.16)}
.inp>svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.inp input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-size:16px}
.eye{border:0;background:none;padding:6px;cursor:pointer;display:flex}
.eye svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chk{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin:2px 2px 10px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#loginBtn{height:52px;box-shadow:0 10px 22px rgba(124,92,245,.38)}
.spin{display:none;width:20px;height:20px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
#loginBtn.busy .spin{display:block}
#loginBtn.busy .btxt{display:none}
.lfoot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:16px}

/* Chat */
#chat{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 8px 10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{position:relative;flex:none;width:42px;height:42px;cursor:pointer}
.avi{width:42px;height:42px;border-radius:50%;background:var(--grad) center/cover no-repeat;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;overflow:hidden}
.avi.big{width:64px;height:64px;font-size:26px;flex:none;cursor:pointer}
.avi.xl{width:120px;height:120px;font-size:44px}
.dot{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:#a7a5b8;border:2.5px solid var(--surface);transition:background .3s}
.dot.on{background:var(--green)}
header h2{font-size:17.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12.5px;color:var(--muted);line-height:1.2}
.status.on{color:var(--green)}
.status.typing{color:var(--accent);font-weight:500}
.icon{background:none;border:0;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
#msgs{flex:1;min-height:0;position:relative;z-index:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.empty{margin:auto;color:var(--muted);text-align:center}
.m{display:flow-root;font-size:var(--msg-fs,15.5px);position:relative;max-width:78%;padding:8px 12px;border-radius:20px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;cursor:pointer;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.m.me{align-self:flex-end;background:var(--grad);color:var(--mine-text);border-bottom-right-radius:6px}
.m.them{align-self:flex-start;background:var(--theirs);color:var(--theirs-text);border-bottom-left-radius:6px}
.m.del{font-style:italic;opacity:.65;box-shadow:none;border:1px dashed var(--line)}
.m.has-img{padding:4px}
.m.has-img .cap{display:flow-root;padding:4px 8px 2px}
.m.has-img .quote{margin:2px 4px 6px}
.m.has-rx{margin-bottom:12px}
.pic{display:block;max-width:100%;max-height:340px;border-radius:16px;object-fit:cover}
.quote{border-left:3px solid var(--accent);background:rgba(124,92,245,.12);border-radius:8px;padding:4px 8px;margin-bottom:6px;font-size:13.5px;line-height:1.35;white-space:normal}
.m.me .quote{border-left-color:rgba(255,255,255,.85);background:rgba(255,255,255,.18)}
.quote b{display:block;font-weight:600;font-size:12.5px}
.quote span{display:block;opacity:.85;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t{float:right;display:flex;align-items:center;gap:4px;font-size:11px;line-height:1;opacity:.8;margin:9px 0 -3px 12px;white-space:nowrap;position:relative;top:1px}
.m.img-only .t{float:none;position:absolute;right:10px;bottom:9px;margin:0;top:auto;background:rgba(0,0,0,.5);color:#fff;border-radius:10px;padding:3px 8px;opacity:1}
.ed{text-decoration:underline dotted;cursor:pointer;margin-right:2px}
.tk{display:inline-flex;align-items:center}
.tk svg{width:17px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tk.pend svg{width:12px;height:12px}
.tk.seen{color:#7dffcf;opacity:1}
.rx{position:absolute;bottom:-12px;right:10px;display:flex;gap:4px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:1px 7px;font-size:14px;box-shadow:var(--shadow)}
.m.them .rx{right:auto;left:10px}
.rx b{font-size:11px;font-weight:500;color:var(--muted);align-self:center}
.flash{animation:fl 1.4s}
@keyframes fl{0%,60%{outline:3px solid #f5b301;outline-offset:2px}100%{outline:3px solid transparent}}
.burst{position:fixed;z-index:80;font-size:44px;pointer-events:none;transform:translate(-50%,-50%);animation:bu .8s ease-out forwards}
@keyframes bu{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

/* Reply / edit bar */
#ctx{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--surface);border-top:1px solid var(--line);border-left:4px solid var(--accent)}
#ctx .ctxtxt{flex:1;min-width:0;font-size:13.5px}
#ctx b{display:block;color:var(--accent);font-weight:600}
#ctx span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

form{display:flex;gap:8px;align-items:flex-end;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--surface);border-top:1px solid var(--line)}
#ctx:not(.hidden)+form{border-top:0}
form textarea{flex:1;min-width:0;display:block;padding:12px 16px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:22px;outline:none;resize:none;max-height:130px;min-height:46px;line-height:1.4;font-size:var(--msg-fs,15.5px);overflow-y:hidden;scrollbar-width:thin}
form textarea:focus{border-color:var(--accent)}
.send{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;cursor:pointer}
.send svg{width:20px;height:20px;fill:#fff}

/* Reaction bar */
#rbar{position:fixed;z-index:60;display:flex;gap:2px;padding:6px 8px;border-radius:32px;background:var(--surface);border:1px solid var(--line);box-shadow:0 14px 44px rgba(40,20,120,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:rbIn .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rbIn{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.3) translateY(8px)}to{opacity:1;transform:none}}
#rbar button,.rrow button{background:none;border:0;font-size:30px;line-height:1.15;padding:4px 7px;border-radius:50%;cursor:pointer;transition:transform .15s;animation:popIn .34s both}
#rbar button:active,.rrow button:active{transform:scale(1.4)}
#rbar button.sel,.rrow button.sel{background:rgba(124,92,245,.16);box-shadow:inset 0 0 0 2px var(--accent)}

/* Panel */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.pbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar h3{font-size:18px;font-weight:600}
#pBody{flex:1;overflow-y:auto;padding:12px}
.card{padding:14px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:14px;line-height:1.6}
.card small{display:block;color:var(--muted);font-size:12px}
.card div{margin-bottom:6px;word-break:break-all}
.card div:last-child{margin-bottom:0}
.card.prof{display:flex;align-items:center;gap:14px}
.card .avi{margin-bottom:0}
.card.prof>div:last-child{min-width:0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:left}
.row small{margin-left:auto;color:var(--muted)}
.row.danger{color:var(--danger)}
.lbl{display:block;color:var(--muted);font-size:14px;margin:6px 2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.hit{padding:10px 12px;margin-bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.hit small{display:block;color:var(--muted)}
.note{color:var(--muted);font-size:14px;margin:8px 2px}

/* Messages area, wallpaper, date lines, scroll button */
#mwrap{flex:1;position:relative;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#wall{position:absolute;inset:-16px;z-index:0;display:none;background-size:cover;background-position:center}
#wall.on{display:block}
#wall::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,var(--dim,0))}
.dsep{align-self:center;margin:10px 0 4px;padding:3px 12px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px}
#toBottom{position:absolute;right:14px;bottom:12px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:0 4px 16px rgba(40,20,120,.25);display:flex;align-items:center;justify-content:center;cursor:pointer}
#toBottom svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#tbBadge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--grad);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sw{height:64px;border:3px solid transparent;border-radius:16px;color:#fff;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.sw.sel{border-color:var(--text)}
.wprev{position:relative;height:170px;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px}
.wprev .wi{position:absolute;inset:-14px;background-size:cover;background-position:center}
.wprev .wd{position:absolute;inset:0}
.wprev .m{position:relative;z-index:2;cursor:default;max-width:70%}
.sl{display:flex;align-items:center;gap:10px;margin:6px 2px 10px;font-size:14px;color:var(--muted)}
.sl span{width:44px}
.sl input{flex:1;accent-color:var(--accent)}
.fprev{display:flex;flex-direction:column;gap:6px;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.fprev .m{cursor:default}

/* Sheet & lightbox */
#sheet{position:fixed;inset:0;background:rgba(12,8,36,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:70;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sbox{width:100%;max-width:720px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -10px 40px rgba(0,0,0,.28);animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sgroup{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:10px}
.sbox button.opt{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:16px;cursor:pointer;transition:background .15s}
.sgroup button.opt:last-child{border-bottom:0}
.sbox button.opt:active{background:var(--bg)}
.sbox button.opt.danger{color:var(--danger)}
.sbox .ic{width:34px;height:34px;border-radius:11px;background:rgba(124,92,245,.13);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;font-style:normal}
.sbox button.opt.danger .ic{background:rgba(229,72,77,.13)}
.sbox button.opt.cancel{justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;font-weight:600;margin-top:2px}
.spv{display:flex;flex-direction:column;gap:2px;padding:10px 14px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;font-size:14px}
.spv b{font-size:12.5px;color:var(--accent);font-weight:600}
.spv span{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.rrow{display:flex;justify-content:space-around;padding:8px 6px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow)}
.sinfo{display:flex;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sinfo div{flex:1;padding:8px 6px;text-align:center;font-size:12px;color:var(--muted);border-right:1px solid var(--line)}
.sinfo div:last-child{border-right:0}
.sinfo b{display:block;color:var(--text);font-size:13px;font-weight:600;margin-top:2px}
#dlg{position:fixed;inset:0;z-index:95;background:rgba(12,8,36,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s ease}
.dcard{width:100%;max-width:340px;background:var(--surface);border-radius:26px;padding:24px 20px 16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:slideUp .26s cubic-bezier(.2,.9,.3,1.1)}
.dico{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:rgba(229,72,77,.13);display:flex;align-items:center;justify-content:center;font-size:30px}
.dcard h4{font-size:18px;font-weight:600;margin-bottom:6px}
.dcard p{color:var(--muted);font-size:14.5px;line-height:1.5;margin-bottom:18px}
.dbtns{display:flex;gap:10px}
.dbtns button{flex:1;height:46px;border:0;border-radius:14px;font-weight:600;cursor:pointer;background:var(--bg)}
.dbtns .yes{background:var(--danger);color:#fff}

/* Multi-select */
#selbar{display:none;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 10px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
#chat.selecting #selbar{display:flex}
#chat.selecting header,#chat.selecting form,#chat.selecting #ctx{display:none}
#selbar b{flex:1;font-size:17px;font-weight:600}
#selbar .pill{border:0;border-radius:18px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--text)}
#selbar .pill.del{background:rgba(229,72,77,.14);color:var(--danger)}
#selbar .pill:disabled{opacity:.4}
.sel-on .m::before{content:'';position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--line);z-index:3}
.sel-on .m.sel::before{content:'✓';display:flex;align-items:center;justify-content:center;background:var(--grad);border-color:transparent;color:#fff;font-size:13px;font-weight:700}
.m.sel{outline:2px solid var(--accent);outline-offset:1px}
.ver{padding:10px 14px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.ver small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ver.cur{border-left:3px solid var(--accent)}
.sh-title{font-weight:600;padding:4px 14px 8px}
#light{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:90;display:flex;align-items:center;justify-content:center}
#light img{max-width:100%;max-height:100%}
.lbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;z-index:1}
.lbar button{border:0;border-radius:22px;padding:9px 16px;background:rgba(255,255,255,.18);color:#fff;font-size:15px;cursor:pointer}
</style>
</head>
<body>

<div id="lock" class="hidden">
  <h1>App Lock</h1>
  <p>Enter your PIN.</p>
  <input id="lockPin" class="field" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
  <div id="lockErr" class="err"></div>
  <button class="primary" id="lockBtn">Unlock</button>
</div>

<div id="login" class="hidden">
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="lcard">
    <div class="logo"><svg viewBox="0 0 24 24"><path fill="#fff" d="M5.5 3h13A3.5 3.5 0 0122 6.5v8a3.5 3.5 0 01-3.5 3.5H11l-4.6 3.6c-.6.5-1.4.1-1.4-.7V18A3.5 3.5 0 012 14.5v-8A3.5 3.5 0 015.5 3z"/><circle cx="8" cy="10.5" r="1.3" fill="#7c5cf5"/><circle cx="12" cy="10.5" r="1.3" fill="#7c5cf5"/><circle cx="16" cy="10.5" r="1.3" fill="#7c5cf5"/></svg></div>
    <h1>Welcome back</h1>
    <div class="sub">Private chat, just for two.</div>
    <label class="inp"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>
      <input id="email" type="email" placeholder="Email address" autocomplete="username" enterkeyhint="next"></label>
    <label class="inp"><svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password" enterkeyhint="done">
      <button type="button" class="eye" id="eye" aria-label="Show password"></button></label>
    <label class="chk"><input type="checkbox" id="keep" checked><span>Keep me signed in on this phone</span></label>
    <div id="err" class="err"></div>
    <button class="primary" id="loginBtn" type="button"><span class="btxt">Sign in</span><span class="spin"></span></button>
    <div class="lfoot">🔒 Private · invited users only</div>
  </div>
</div>

<div id="chat" class="hidden">
  <div id="selbar">
    <button class="icon" id="selX" aria-label="Cancel selection">✕</button>
    <b id="selCount">0 selected</b>
    <button class="pill" id="selAll">All</button>
    <button class="pill del" id="selDel">Delete</button>
  </div>
  <header>
    <div class="who">
      <div class="av" id="av"><div class="avi" id="avi"></div><span class="dot" id="dot"></span></div>
      <div><h2 id="title">Chat</h2><div id="status" class="status">Offline</div></div>
    </div>
    <button class="icon" id="menuBtn" aria-label="Menu">⋮</button>
  </header>
  <div id="mwrap">
    <div id="wall"></div>
    <div id="msgs"></div>
    <button id="toBottom" class="hidden" aria-label="Scroll to latest"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg><span id="tbBadge" class="hidden">0</span></button>
  </div>
  <div id="ctx" class="hidden"><div class="ctxtxt"><b id="ctxTitle"></b><span id="ctxSnip"></span></div><button class="icon" id="ctxX" aria-label="Cancel">✕</button></div>
  <form id="sendForm" autocomplete="off">
    <button type="button" class="icon" id="attachBtn" aria-label="Photo">📎</button>
    <input id="file" type="file" accept="image/*" class="hidden">
    <textarea id="text" rows="1" placeholder="Type a message" enterkeyhint="enter" maxlength="4000"></textarea>
    <button type="submit" class="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.99.99 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg></button>
  </form>
</div>

<div id="rbar" class="hidden"></div>

<div id="panel" class="overlay hidden">
  <div class="pbar"><button class="icon" id="pBack" aria-label="Back">←</button><h3 id="pTitle"></h3></div>
  <div id="pBody"></div>
</div>
<div id="sheet" class="hidden"></div>
<div id="dlg" class="hidden"><div class="dcard"><div class="dico" id="dIco">🗑️</div><h4 id="dTitle"></h4><p id="dText"></p><div class="dbtns"><button id="dNo">Cancel</button><button id="dYes" class="yes">Delete</button></div></div></div>
<div id="light" class="hidden">
  <div class="lbar"><button id="lDl">⬇ Download</button><button id="lX">✕</button></div>
  <img alt="">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence, browserSessionPersistence, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp,
         doc, setDoc, updateDoc, getDocs, writeBatch, arrayUnion, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRXqzXMjL-c4oUpRZMF1ueIVTkGVb0SMs",
  authDomain: "weee-b3da7.firebaseapp.com",
  projectId: "weee-b3da7",
  storageBucket: "weee-b3da7.firebasestorage.app",
  messagingSenderId: "742801049611",
  appId: "1:742801049611:web:304c3baa78eacdf5f0df0e"
};
const UIDS = ['mMmmSKU8lthqr64r660nx8kPIys2', 'bkBV7FBM9pN4am3xQwYzeitBaD83'];
const REACTIONS = ['😘', '👍', '😔', '🤬', '🙂'];

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

let me = null, partner = null, myEmail = '', msgs = [], nick = {}, clearedAt = 0, partnerPres = null;
let unsubs = [], timers = [], firstLoad = true;
let profiles = {};
let replyTo = null, editing = null;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const themName = () => nick[partner] || 'Them';

/* ---------- theme ---------- */
const root = document.documentElement;
root.dataset.theme = store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const PRESETS = {
  violet:   { n: 'Violet',   a: '#8b5cf6', b: '#5b8def', ac: '#7c5cf5', acd: '#8b7cff', bl: '#f2f0fb', bd: '#0c0d17' },
  midnight: { n: 'Midnight', a: '#4338ca', b: '#1e40af', ac: '#6366f1', acd: '#818cf8', bl: '#eceef9', bd: '#07091a' },
  rose:     { n: 'Rose',     a: '#f43f5e', b: '#ec4899', ac: '#e11d48', acd: '#fb7185', bl: '#fff0f3', bd: '#190b11' },
  ocean:    { n: 'Ocean',    a: '#0ea5e9', b: '#2563eb', ac: '#0284c7', acd: '#38bdf8', bl: '#e8f5fd', bd: '#06121b' },
  forest:   { n: 'Forest',   a: '#16a34a', b: '#0d9488', ac: '#15803d', acd: '#4ade80', bl: '#ecf8ef', bd: '#07140c' },
  sunset:   { n: 'Sunset',   a: '#f97316', b: '#ec4899', ac: '#ea580c', acd: '#fb923c', bl: '#fff3ea', bd: '#190e09' }
};
const DEF_THEME = { preset: 'violet', wall: '', blur: 0, dim: 25 };
let themeCfg = { ...DEF_THEME }, previewCfg = null;
function applyTheme(cfg) {
  cfg = cfg || previewCfg || themeCfg;
  const p = PRESETS[cfg.preset] || PRESETS.violet, dark = root.dataset.theme === 'dark', st = root.style;
  st.setProperty('--grad', 'linear-gradient(135deg,' + p.a + ' 0%,' + p.b + ' 100%)');
  st.setProperty('--accent', dark ? p.acd : p.ac);
  st.setProperty('--bg', dark ? p.bd : p.bl);
  const w = $('wall');
  if (cfg.wall) {
    w.style.backgroundImage = 'url("' + cfg.wall + '")';
    w.style.filter = 'blur(' + (cfg.blur || 0) + 'px)';
    w.style.setProperty('--dim', (cfg.dim || 0) / 100);
    w.classList.add('on');
  } else { w.classList.remove('on'); w.style.backgroundImage = ''; }
}
function toggleTheme() {
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next; store.set('theme', next); applyTheme();
}
const FS = { small: '14px', default: '15.5px', large: '17.5px', xl: '19.5px' };
function applyFont() { root.style.setProperty('--msg-fs', FS[store.get('fs')] || FS.default); }
applyTheme(); applyFont();

/* ---------- profile photos ---------- */
const initialOf = t => (t || '').trim().charAt(0).toUpperCase() || '•';
function setAv(node, photo, letter) {
  node.style.backgroundImage = photo ? 'url("' + photo + '")' : '';
  node.textContent = photo ? '' : letter;
}
function applyAvatars() {
  if (!partner) return;
  setAv($('avi'), profiles[partner], initialOf(nick[partner]));
}
$('av').onclick = () => { if (profiles[partner]) openLight(profiles[partner]); };

/* ---------- app lock ---------- */
async function sha(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('chat-salt:' + s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
function lockIfNeeded() {
  if (store.get('pinhash')) { $('lock').classList.remove('hidden'); $('lockPin').value = ''; $('lockErr').textContent = ''; }
}
$('lockBtn').onclick = async () => {
  if (await sha($('lockPin').value) === store.get('pinhash')) $('lock').classList.add('hidden');
  else { $('lockErr').textContent = 'Wrong PIN.'; $('lockPin').value = ''; }
};
$('lockPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('lockBtn').click(); });
lockIfNeeded();

let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    hiddenAt = Date.now(); setPresence(false); stopTyping();
  } else {
    if (hiddenAt && Date.now() - hiddenAt > 30000) lockIfNeeded();
    setPresence(true); markReceived();
  }
});
window.addEventListener('focus', () => markReceived());
window.addEventListener('pagehide', () => setPresence(false));

/* ---------- login ---------- */
const EYE = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0112 6c6.4 0 10 6 10 6a17 17 0 01-3.2 3.9M6.5 7.6C3.9 9.3 2 12 2 12s3.6 6 10 6c1.5 0 2.8-.3 4-.8"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>';
$('eye').innerHTML = EYE;
$('eye').onclick = () => {
  const p = $('pass'), show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('eye').innerHTML = show ? EYE_OFF : EYE;
};
function shake() {
  document.querySelectorAll('#login .inp').forEach(n => { n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); });
}
// Sign-in happens ONLY when the button is pressed (no auto-login, no Enter-key submit).
$('loginBtn').onclick = async () => {
  const em = $('email').value.trim(), pw = $('pass').value;
  $('err').textContent = '';
  if (!em || !pw) { $('err').textContent = 'Enter your email and password.'; shake(); return; }
  $('loginBtn').disabled = true; $('loginBtn').classList.add('busy');
  try {
    await setPersistence(auth, $('keep').checked ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, em, pw);
  } catch (e) {
    const c = e && e.code;
    $('err').textContent = c === 'auth/network-request-failed' ? 'No connection. Please try again.'
      : c === 'auth/too-many-requests' ? 'Too many attempts. Try again later.'
      : 'Wrong email or password.';
    shake();
  }
  $('loginBtn').disabled = false; $('loginBtn').classList.remove('busy');
};

onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  timers.forEach(t => clearInterval(t)); timers = [];
  if (user) {
    me = { uid: user.uid }; myEmail = user.email || '';
    partner = UIDS.find(u => u !== user.uid) || UIDS[0];
    $('login').classList.add('hidden');
    $('chat').classList.remove('hidden');
    firstLoad = true;
    startChat();
  } else {
    me = null; msgs = []; partnerPres = null; myEmail = ''; profiles = {};
    themeCfg = { ...DEF_THEME }; previewCfg = null; applyTheme(); known = new Set(); unread = 0; setText(''); exitSelect();
    clearCtx(); closePanel();
    $('chat').classList.add('hidden');
    $('login').classList.remove('hidden');
  }
});

/* ---------- data ---------- */
const ms = t => t ? t.toMillis() : Date.now();
const ST = { serverTimestamps: 'estimate' };

function startChat() {
  unsubs.push(onSnapshot(query(collection(db, 'messages'), orderBy('createdAt', 'desc'), limit(200)),
    { includeMetadataChanges: true }, snap => {
      msgs = snap.docs.map(d => ({ id: d.id, ...d.data(ST), pending: d.metadata.hasPendingWrites })).reverse();
      render(); markReceived();
    }, e => console.error(e)));
  unsubs.push(onSnapshot(doc(db, 'meta', 'settings'), s => {
    nick = (s.exists() && s.data().nick) || {};
    $('title').textContent = nick[partner] || 'Chat';
    applyAvatars(); render();
  }, e => console.error(e)));
  unsubs.push(onSnapshot(doc(db, 'users', me.uid), s => {
    const d = s.exists() ? s.data(ST) : null;
    clearedAt = d && d.clearedAt ? d.clearedAt.toMillis() : 0;
    render();
  }, e => console.error(e)));
  unsubs.push(onSnapshot(doc(db, 'presence', partner), s => {
    partnerPres = s.exists() ? s.data(ST) : null; updateStatus(); applyAvatars();
  }, e => console.error(e)));
  [me.uid, partner].forEach(u => unsubs.push(onSnapshot(doc(db, 'profiles', u), s => {
    profiles[u] = s.exists() ? (s.data().photo || '') : ''; applyAvatars();
  }, e => console.error(e))));
  unsubs.push(onSnapshot(doc(db, 'meta', 'theme'), s => {
    themeCfg = s.exists() ? { ...DEF_THEME, ...s.data() } : { ...DEF_THEME };
    applyTheme();
  }, e => console.error(e)));
  const d0 = store.get('draft:' + me.uid); if (d0) setText(d0);
  setPresence(document.visibilityState === 'visible');
  timers.push(setInterval(() => { if (document.visibilityState === 'visible') setPresence(true); }, 30000));
  timers.push(setInterval(updateStatus, 5000));
  updateStatus();
}

function visibleMsgs() {
  return msgs.filter(m => !(m.hiddenFor || []).includes(me.uid) && ms(m.createdAt) > clearedAt);
}

function markReceived() {
  if (!me || !msgs.length) return;
  const seen = document.visibilityState === 'visible';
  const batch = writeBatch(db); let n = 0;
  for (const m of msgs) {
    if (m.uid === me.uid || m.pending) continue;
    const u = {};
    if (!m.deliveredAt) u.deliveredAt = serverTimestamp();
    if (seen && !m.seenAt) u.seenAt = serverTimestamp();
    if (Object.keys(u).length) { batch.update(doc(db, 'messages', m.id), u); n++; }
  }
  if (n) batch.commit().catch(e => console.error(e));
}

/* ---------- activity (online / typing) ---------- */
function setPresence(online) {
  if (!me) return;
  setDoc(doc(db, 'presence', me.uid), { online, lastSeen: serverTimestamp(), email: myEmail }, { merge: true }).catch(() => {});
}
let typingTimer = null, lastTypingWrite = 0;
function stopTyping() {
  clearTimeout(typingTimer); lastTypingWrite = 0;
  if (me) setDoc(doc(db, 'presence', me.uid), { typing: false }, { merge: true }).catch(() => {});
}
$('text').addEventListener('input', () => {
  if (!$('text').value) { stopTyping(); return; }
  const now = Date.now();
  if (now - lastTypingWrite > 2000 && me) {
    lastTypingWrite = now;
    setDoc(doc(db, 'presence', me.uid), { typing: true, typingAt: serverTimestamp() }, { merge: true }).catch(() => {});
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(stopTyping, 3000);
});
const clock = t => new Date(t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
function fmtSeen(t) {
  const d = new Date(t), n = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(n) - day(d)) / 86400000);
  if (diff === 0) return 'today ' + clock(t);
  if (diff === 1) return 'yesterday ' + clock(t);
  return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short' }) + ' ' + clock(t);
}
function updateStatus() {
  const p = partnerPres, now = Date.now();
  const last = p && p.lastSeen ? p.lastSeen.toMillis() : 0;
  const online = !!(p && p.online && now - last < 75000);
  const typing = online && p.typing && p.typingAt && now - p.typingAt.toMillis() < 6000;
  $('dot').classList.toggle('on', online);
  const st = $('status');
  st.className = 'status' + (typing ? ' typing' : online ? ' on' : '');
  st.textContent = typing ? 'typing…' : online ? 'Active now' : last ? 'Last seen ' + fmtSeen(last) : 'Offline';
}

/* ---------- render ---------- */
const timeStr = t => clock(ms(t));
const fullTime = t => t ? new Date(ms(t)).toLocaleString('en-US', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '—';
const ICON = {
  pend: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.8"/><path d="M6 3.4V6l1.8 1.1"/></svg>',
  one: '<svg viewBox="0 0 19 12"><path d="M3 6.5l3.2 3.2L13 2.5"/></svg>',
  two: '<svg viewBox="0 0 19 12"><path d="M1.5 6.5l3.2 3.2L11.5 2.5"/><path d="M7.2 9.4l.5.5L14.5 2.5"/></svg>'
};
function snippet(m) {
  if (!m) return 'Original message';
  if (m.deleted) return '🚫 Message deleted';
  const s = m.image ? '📷 ' + (m.text || 'Photo') : (m.text || '');
  return s.length > 90 ? s.slice(0, 90) + '…' : s;
}

function bubble(m) {
  const mine = m.uid === me.uid;
  let cap = null;
  const b = el('div', 'm ' + (mine ? 'me' : 'them'));
  b.id = 'm-' + m.id; b.dataset.id = m.id;
  if (m.deleted) {
    b.classList.add('del'); b.appendChild(document.createTextNode('🚫 This message was deleted'));
  } else {
    if (m.image) b.classList.add('has-img');
    if (m.image && !m.text) b.classList.add('img-only');
    if (m.replyTo) {
      const o = msgs.find(x => x.id === m.replyTo.id);
      const q = el('div', 'quote'); q.dataset.ref = m.replyTo.id;
      q.appendChild(el('b', '', m.replyTo.uid === me.uid ? 'You' : themName()));
      q.appendChild(el('span', '', snippet(o)));
      b.appendChild(q);
    }
    if (m.image) {
      const i = el('img', 'pic'); i.src = m.image; i.alt = 'Photo'; i.draggable = false;
      b.appendChild(i);
    }
    if (m.text) {
      if (m.image) { cap = el('span', 'cap', m.text); b.appendChild(cap); } else b.appendChild(document.createTextNode(m.text));
    }
  }
  const t = el('span', 't');
  if (m.edited && !m.deleted) t.appendChild(el('span', 'ed', 'edited'));
  t.appendChild(document.createTextNode(timeStr(m.createdAt)));
  if (mine && !m.deleted) {
    const tk = el('span', 'tk');
    if (m.pending) { tk.classList.add('pend'); tk.innerHTML = ICON.pend; }
    else if (m.seenAt) { tk.classList.add('seen'); tk.innerHTML = ICON.two; }
    else if (m.deliveredAt) tk.innerHTML = ICON.two;
    else tk.innerHTML = ICON.one;
    t.appendChild(tk);
  }
  (cap || b).appendChild(t);
  const rx = m.reactions && !m.deleted ? Object.values(m.reactions) : [];
  if (rx.length) {
    b.classList.add('has-rx');
    const counts = {}; rx.forEach(e => counts[e] = (counts[e] || 0) + 1);
    const wrap = el('span', 'rx');
    Object.keys(counts).forEach(e => {
      wrap.appendChild(document.createTextNode(e));
      if (counts[e] > 1) wrap.appendChild(el('b', '', counts[e]));
    });
    b.appendChild(wrap);
  }
  return b;
}

let known = new Set(), unread = 0;
function dayLabel(d) {
  const n = new Date(), day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(n) - day(d)) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  const o = { weekday: 'short', month: 'short', day: 'numeric' };
  if (d.getFullYear() !== n.getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('en-US', o);
}
function updateToBottom() {
  const box = $('msgs'), btn = $('toBottom');
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  if (near) unread = 0;
  btn.classList.toggle('hidden', near);
  $('tbBadge').textContent = unread; $('tbBadge').classList.toggle('hidden', !unread);
}
$('msgs').addEventListener('scroll', updateToBottom);
$('toBottom').onclick = () => { unread = 0; const b = $('msgs'); b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' }); updateToBottom(); };

function render() {
  if (!me) return;
  const box = $('msgs');
  const prev = box.scrollTop;
  const atBottom = firstLoad || box.scrollHeight - box.scrollTop - box.clientHeight < 90;
  const list = visibleMsgs();
  if (firstLoad) { known = new Set(); unread = 0; }
  const fresh = list.filter(m => m.uid !== me.uid && !m.pending && !known.has(m.id));
  if (!firstLoad && !atBottom) unread += fresh.length;
  list.forEach(m => known.add(m.id));
  box.innerHTML = '';

function toDataUrl(file) {

      let q = 0.82, out = c.toDataURL('image/jpeg', q);
      while (out.length > 150000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url);
      out.length > 190000 ? rej(new Error('big')) : res(out);

  if (!d) return e[0] + '••••';
  const i = d.lastIndexOf('.'), host = i > 0 ? d.slice(0, i) : d, tld = i > 0 ? d.slice(i) : '';
  return l[0] + '••••@' + host[0] + '••••' + tld;
}
function hideEmails() {
  emailsShown = false; askPw = false; clearTimeout(emailTimer);
  if (view === 'home' && !$('panel').classList.contains('hidden')) showHome();
}
async function revealEmails(pw, errNode, btn) {
  if (!pw) { errNode.textContent = 'Enter your password.'; return; }
  btn.disabled = true; errNode.textContent = '';
  try {
    await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(myEmail, pw));
    emailsShown = true; askPw = false;
    clearTimeout(emailTimer); emailTimer = setTimeout(hideEmails, 30000);
    showHome();
  } catch (e) {
    errNode.textContent = e && e.code === 'auth/too-many-requests' ? 'Too many attempts. Try again later.' : 'Wrong password.';
    btn.disabled = false;
  }
}

function showFont() {
  const b = setView('font', 'Text size');
  const cur = store.get('fs') || 'default';
  const pv = el('div', 'fprev');
  pv.appendChild(el('div', 'm them', 'Hey! How was your day? 😊'));
  pv.appendChild(el('div', 'm me', 'Pretty good, I missed you ❤️'));
  b.appendChild(pv);
  [['small', 'Small'], ['default', 'Default'], ['large', 'Large'], ['xl', 'Extra large']].forEach(([k, l]) => {
    b.appendChild(row(cur === k ? '●' : '○', l, () => { store.set('fs', k); applyFont(); showFont(); }));
  });
  b.appendChild(el('div', 'note', 'Text size changes only on this phone.'));
}

function wallpaperUrl(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let sc = Math.min(1, 1280 / Math.max(img.width, img.height));
      for (let attempt = 0; attempt < 4; attempt++) {
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        for (let q = 0.72; q >= 0.4; q -= 0.08) {
          const out = c.toDataURL('image/jpeg', q);
          if (out.length <= 280000) { URL.revokeObjectURL(url); res(out); return; }
        }
        sc *= 0.8;
      }
      URL.revokeObjectURL(url); rej(new Error('big'));
    };
    img.onerror = rej; img.src = url;
  });
}

function showTheme() {
  const b = setView('theme', 'Chat theme');
  if (!previewCfg) previewCfg = { ...themeCfg };
  b.appendChild(el('div', 'note', 'Theme and wallpaper are shared: when you apply them, they change on both phones. Dark / light mode stays personal.'));
  b.appendChild(el('label', 'lbl', 'Colors'));
  const g = el('div', 'swatches');
  Object.entries(PRESETS).forEach(([k, p]) => {
    const sw = el('button', 'sw' + (previewCfg.preset === k ? ' sel' : ''), p.n);
    sw.style.background = 'linear-gradient(135deg,' + p.a + ',' + p.b + ')';
    sw.onclick = () => { previewCfg.preset = k; applyTheme(); showTheme(); };
    g.appendChild(sw);
  });
  b.appendChild(g);

  b.appendChild(el('label', 'lbl', 'Wallpaper'));
  const pv = el('div', 'wprev'), wi = el('div', 'wi'), wd = el('div', 'wd');
  pv.appendChild(wi); pv.appendChild(wd);
  pv.appendChild(el('div', 'm them', 'Hi there 👋')); pv.appendChild(el('div', 'm me', 'Hello! Love this one'));
  const upd = () => {
    wi.style.backgroundImage = previewCfg.wall ? 'url("' + previewCfg.wall + '")' : '';
    wi.style.filter = 'blur(' + (previewCfg.blur || 0) + 'px)';
    wd.style.background = previewCfg.wall ? 'rgba(0,0,0,' + (previewCfg.dim || 0) / 100 + ')' : 'none';
    applyTheme();
  };
  b.appendChild(pv); upd();

  const file = el('input'); file.type = 'file'; file.accept = 'image/*'; file.className = 'hidden';
  file.onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { previewCfg.wall = await wallpaperUrl(f); if (!previewCfg.dim) previewCfg.dim = 25; applyTheme(); showTheme(); }
    catch (err) { alert('Could not use that photo.'); console.error(err); }
  };
  b.appendChild(file);
  b.appendChild(row('🖼', previewCfg.wall ? 'Change wallpaper photo' : 'Upload wallpaper photo', () => file.click()));

  if (previewCfg.wall) {
    const mk = (label, min, max, step, key, unit) => {
      const r = el('div', 'sl'); r.appendChild(el('span', '', label));
      const i = el('input'); i.type = 'range'; i.min = min; i.max = max; i.step = step; i.value = previewCfg[key] || 0;
      const v = el('span', '', i.value + unit);
      i.oninput = () => { previewCfg[key] = +i.value; v.textContent = i.value + unit; upd(); };
      r.appendChild(i); r.appendChild(v); return r;
    };
    b.appendChild(mk('Blur', 0, 12, 1, 'blur', 'px'));
    b.appendChild(mk('Dim', 0, 70, 5, 'dim', '%'));
    const rm = row('🗑', 'Remove wallpaper', () => { previewCfg.wall = ''; applyTheme(); showTheme(); }, '', true);
    b.appendChild(rm);
  }

  const apply = el('button', 'primary', 'Apply for both'); apply.style.marginTop = '8px';
  apply.onclick = async () => {
    if (!confirm('This changes the theme and wallpaper on both phones. Continue?')) return;
    apply.disabled = true;
    try {
      const c = previewCfg;
      await setDoc(doc(db, 'meta', 'theme'), { preset: c.preset, wall: c.wall || '', blur: c.blur || 0, dim: c.dim || 0, by: me.uid, updatedAt: serverTimestamp() });
      previewCfg = null; applyTheme(); showHome();
    } catch (e) { alert('Could not save the theme.'); console.error(e); apply.disabled = false; }
  };
  b.appendChild(apply);
  const reset = el('button', 'row', 'Reset to default'); reset.style.marginTop = '10px';
  reset.onclick = () => { previewCfg = { ...DEF_THEME }; applyTheme(); showTheme(); };
  b.appendChild(reset);
}

function showNick() {
  const b = setView('nick', 'Nicknames');
  b.appendChild(el('label', 'lbl', 'Your nickname'));
  const a = el('input', 'field'); a.value = nick[me.uid] || ''; a.maxLength = 30; b.appendChild(a);
  b.appendChild(el('label', 'lbl', 'Their nickname'));
  const c = el('input', 'field'); c.value = nick[partner] || ''; c.maxLength = 30; b.appendChild(c);
  const s = el('button', 'primary', 'Save');
  s.onclick = async () => {
    try {
      await setDoc(doc(db, 'meta', 'settings'), { nick: { [me.uid]: a.value.trim(), [partner]: c.value.trim() } }, { merge: true });
      showHome();
    } catch (e) { alert('Could not save.'); console.error(e); }
  };
  b.appendChild(s);
}

function showMedia() {
  const b = setView('media', 'All attachments');
  const list = visibleMsgs().filter(m => m.image && !m.deleted).reverse();
  if (!list.length) { b.appendChild(el('div', 'note', 'No photos have been sent yet.')); return; }
  const g = el('div', 'grid');
  list.forEach(m => { const i = el('img'); i.src = m.image; i.alt = 'Photo'; i.onclick = () => openLight(m.image); g.appendChild(i); });
  b.appendChild(g);
}

function showSearch() {
  const b = setView('search', 'Search messages');
  const inp = el('input', 'field'); inp.placeholder = 'Search…'; b.appendChild(inp);
  const out = el('div'); b.appendChild(out);
  inp.oninput = () => {
    const q = inp.value.trim().toLowerCase(); out.innerHTML = '';
    if (!q) return;
    const hits = visibleMsgs().filter(m => !m.deleted && m.text && m.text.toLowerCase().includes(q)).reverse().slice(0, 50);
    if (!hits.length) { out.appendChild(el('div', 'note', 'No results.')); return; }
    hits.forEach(m => {
      const h = el('div', 'hit', m.text.length > 90 ? m.text.slice(0, 90) + '…' : m.text);
      h.appendChild(el('small', '', (m.uid === me.uid ? 'You' : themName()) + ' · ' + fullTime(m.createdAt)));
      h.onclick = () => { closePanel(); jumpTo(m.id); };
      out.appendChild(h);
    });
  };
  inp.focus();
}

function showLock() {
  const b = setView('lock', 'App lock');
  const has = !!store.get('pinhash');
  b.appendChild(el('div', 'note', 'The PIN is stored only on this phone. It is asked when you open the app or after it has been in the background for 30 seconds.'));
  const p = el('input', 'field'); p.type = 'password'; p.inputMode = 'numeric'; p.placeholder = 'New PIN (4–8 digits)'; p.maxLength = 8; b.appendChild(p);
  const s = el('button', 'primary', has ? 'Change PIN' : 'Turn on PIN');
  s.onclick = async () => {
    if (!/^\d{4,8}$/.test(p.value)) { alert('Enter 4 to 8 digits.'); return; }
    store.set('pinhash', await sha(p.value)); showHome();
  };
  b.appendChild(s);
  if (has) {
    const d = el('button', 'row danger', 'Turn off PIN'); d.style.marginTop = '12px';
    d.onclick = () => { store.del('pinhash'); showHome(); };
    b.appendChild(d);
  }
}

/* ---------- clear chat ---------- */
async function clearForMe() {
  try { await setDoc(doc(db, 'users', me.uid), { clearedAt: serverTimestamp() }); closePanel(); }
  catch (e) { alert('Could not clear the chat.'); console.error(e); }
}
async function clearForAll() {
  const ok = await confirmDialog({ icon: '⚠️', title: 'Clear the whole chat?', text: 'All messages will be permanently deleted for both of you. This can’t be undone.', ok: 'Clear chat' });
  if (!ok) return;
  try {
    const snap = await getDocs(collection(db, 'messages'));
    let batch = writeBatch(db), n = 0;
    for (const d of snap.docs) {
      batch.delete(d.ref); n++;
      if (n === 400) { await batch.commit(); batch = writeBatch(db); n = 0; }
    }
    if (n) await batch.commit();
    closePanel();
  } catch (e) { alert('Could not clear the chat.'); console.error(e); }
}
