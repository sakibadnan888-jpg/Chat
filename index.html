<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cf5">
<title>Our Chat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Chat">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f0fb; --surface:#ffffff; --text:#1d1b2e; --muted:#7b7894; --line:#e6e2f5;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#5b8def 100%);
  --mine-text:#ffffff; --theirs:#ffffff; --theirs-text:#1d1b2e;
  --accent:#7c5cf5; --green:#22c55e; --danger:#e5484d; --shadow:0 1px 3px rgba(60,40,140,.12);
}
:root[data-theme="dark"]{
  --bg:#0c0d17; --surface:#141626; --text:#ecebf7; --muted:#8c8aa8; --line:#252845;
  --theirs:#1f2238; --theirs-text:#ecebf7; --accent:#8b7cff; --danger:#ff6b70; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15.5px;overflow:hidden;touch-action:manipulation}
button,input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* Login & lock */
#lock{height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:400px;margin:0 auto}
#lock{position:fixed;inset:0;max-width:none;align-items:center;background:var(--bg);z-index:100}
#lock>*{width:100%;max-width:340px}
#lock h1{font-size:30px;font-weight:600;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
#lock p{color:var(--muted);margin-bottom:24px}
.field{width:100%;padding:14px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;outline:none}
.field:focus{border-color:var(--accent)}
.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--grad);color:#fff;font-weight:600;cursor:pointer}
.primary:disabled{opacity:.6}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-bottom:10px}

/* Premium login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;
  background:radial-gradient(900px 500px at 0% 0%,rgba(139,92,246,.28),transparent 60%),radial-gradient(900px 500px at 100% 100%,rgba(91,141,239,.28),transparent 60%),var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;animation:flt 12s ease-in-out infinite;pointer-events:none}
.o1{width:260px;height:260px;background:#8b5cf6;top:-70px;left:-70px}
.o2{width:300px;height:300px;background:#5b8def;bottom:-90px;right:-90px;animation-delay:-5s}
@keyframes flt{50%{transform:translate(30px,25px) scale(1.08)}}
.lcard{position:relative;width:100%;max-width:380px;padding:30px 22px 20px;border-radius:28px;background:rgba(255,255,255,.74);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.6);box-shadow:0 24px 60px rgba(60,40,140,.25);animation:rise .6s ease both}
:root[data-theme="dark"] .lcard{background:rgba(20,22,38,.72);border-color:rgba(255,255,255,.08)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logo{width:66px;height:66px;border-radius:21px;background:var(--grad);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(124,92,245,.45)}
.logo svg{width:36px;height:36px}
.lcard h1{font-size:26px;font-weight:600;text-align:center;margin-bottom:4px}
.lcard .sub{color:var(--muted);text-align:center;margin-bottom:24px;font-size:14.5px}
.inp{display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;height:52px;border:1px solid var(--line);background:var(--surface);border-radius:14px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,92,245,.16)}
.inp>svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.inp input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-size:16px}
.eye{border:0;background:none;padding:6px;cursor:pointer;display:flex}
.eye svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chk{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin:2px 2px 10px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#loginBtn{height:52px;box-shadow:0 10px 22px rgba(124,92,245,.38)}
.spin{display:none;width:20px;height:20px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
#loginBtn.busy .spin{display:block}
#loginBtn.busy .btxt{display:none}
.lfoot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:16px}

/* Chat */
#chat{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 8px 10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{position:relative;flex:none;width:42px;height:42px;cursor:pointer}
.avi{width:42px;height:42px;border-radius:50%;background:var(--grad) center/cover no-repeat;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;overflow:hidden}
.avi.big{width:64px;height:64px;font-size:26px;flex:none;cursor:pointer}
.avi.xl{width:120px;height:120px;font-size:44px}
.dot{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:#a7a5b8;border:2.5px solid var(--surface);transition:background .3s}
.dot.on{background:var(--green)}
header h2{font-size:17.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12.5px;color:var(--muted);line-height:1.2}
.status.on{color:var(--green)}
.status.typing{color:var(--accent);font-weight:500}
.icon{background:none;border:0;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
#msgs{flex:1;min-height:0;position:relative;z-index:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.empty{margin:auto;color:var(--muted);text-align:center;padding:20px;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:16.5px;margin-bottom:4px}
.empty svg.art{width:150px;height:110px;display:block;margin:0 auto 12px}
.m{display:flow-root;font-size:var(--msg-fs,15.5px);position:relative;max-width:78%;padding:8px 12px;border-radius:20px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;cursor:pointer;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.m.me{align-self:flex-end;background:var(--grad);color:var(--mine-text);border-bottom-right-radius:6px}
.m.them{align-self:flex-start;background:var(--theirs);color:var(--theirs-text);border-bottom-left-radius:6px}
.m.del{font-style:italic;opacity:.65;box-shadow:none;border:1px dashed var(--line)}
.m.has-img{padding:4px}
.m.has-img .cap{display:flow-root;padding:4px 8px 2px}
.m.has-img .quote{margin:2px 4px 6px}
.m.has-rx{margin-bottom:12px}
.pic{display:block;max-width:100%;max-height:340px;border-radius:16px;object-fit:cover}
.quote{border-left:3px solid var(--accent);background:rgba(124,92,245,.12);border-radius:8px;padding:4px 8px;margin-bottom:6px;font-size:13.5px;line-height:1.35;white-space:normal}
.m.me .quote{border-left-color:rgba(255,255,255,.85);background:rgba(255,255,255,.18)}
.quote b{display:block;font-weight:600;font-size:12.5px}
.quote span{display:block;opacity:.85;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t{float:right;display:flex;align-items:center;gap:4px;font-size:11px;line-height:1;opacity:.8;margin:9px 0 -3px 12px;white-space:nowrap;position:relative;top:1px}
.m.img-only .t{float:none;position:absolute;right:10px;bottom:9px;margin:0;top:auto;background:rgba(0,0,0,.5);color:#fff;border-radius:10px;padding:3px 8px;opacity:1}
.ed{text-decoration:underline dotted;cursor:pointer;margin-right:2px}
.tk{display:inline-flex;align-items:center}
.tk svg{width:17px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tk.pend svg{width:12px;height:12px}
.tk.seen{color:#7dffcf;opacity:1}
.rx{position:absolute;bottom:-12px;right:10px;display:flex;gap:4px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:1px 7px;font-size:14px;box-shadow:var(--shadow)}
.m.them .rx{right:auto;left:10px}
.rx b{font-size:11px;font-weight:500;color:var(--muted);align-self:center}
.flash{animation:fl 1.4s}
@keyframes fl{0%,60%{outline:3px solid #f5b301;outline-offset:2px}100%{outline:3px solid transparent}}
.burst{position:fixed;z-index:80;font-size:44px;pointer-events:none;transform:translate(-50%,-50%);animation:bu .8s ease-out forwards}
@keyframes bu{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

/* Reply / edit bar */
#ctx{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--surface);border-top:1px solid var(--line);border-left:4px solid var(--accent)}
#ctx .ctxtxt{flex:1;min-width:0;font-size:13.5px}
#ctx b{display:block;color:var(--accent);font-weight:600}
#ctx span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

form{display:flex;gap:8px;align-items:flex-end;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--surface);border-top:1px solid var(--line)}
#ctx:not(.hidden)+form{border-top:0}
form textarea{flex:1;min-width:0;display:block;padding:12px 16px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:22px;outline:none;resize:none;max-height:130px;min-height:46px;line-height:1.4;font-size:var(--msg-fs,15.5px);overflow-y:hidden;scrollbar-width:thin}
form textarea:focus{border-color:var(--accent)}
.send{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;cursor:pointer}
.send svg{width:20px;height:20px;fill:#fff}

/* Reaction bar */
#rbar{position:fixed;z-index:60;display:flex;gap:2px;padding:6px 8px;border-radius:32px;background:var(--surface);border:1px solid var(--line);box-shadow:0 14px 44px rgba(40,20,120,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:rbIn .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rbIn{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.3) translateY(8px)}to{opacity:1;transform:none}}
#rbar button,.rrow button{background:none;border:0;font-size:30px;line-height:1.15;padding:4px 7px;border-radius:50%;cursor:pointer;transition:transform .15s;animation:popIn .34s both}
#rbar button:active,.rrow button:active{transform:scale(1.4)}
#rbar button.sel,.rrow button.sel{background:rgba(124,92,245,.16);box-shadow:inset 0 0 0 2px var(--accent)}

/* Panel */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.pbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar h3{font-size:18px;font-weight:600}
#pBody{flex:1;overflow-y:auto;padding:12px}
.card{padding:14px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:14px;line-height:1.6}
.card small{display:block;color:var(--muted);font-size:12px}
.card div{margin-bottom:6px;word-break:break-all}
.card div:last-child{margin-bottom:0}
.card.prof{display:flex;align-items:center;gap:14px}
.card .avi{margin-bottom:0}
.card.prof>div:last-child{min-width:0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:left}
.row small{margin-left:auto;color:var(--muted)}
.row.danger{color:var(--danger)}
.gh{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 8px 8px}
.sgrp{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sgrp .row{border:0;border-radius:0;margin:0;background:none;border-bottom:1px solid var(--line);padding:11px 14px}
.sgrp .row:last-child{border-bottom:0}
.sgrp .row:active{background:var(--bg)}
.ric{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(124,92,245,.13);color:var(--accent);font-size:18px}
.ric svg,.sbox .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row.danger .ric{background:rgba(229,72,77,.13);color:var(--danger)}
.rtx{flex:1;min-width:0;text-align:left}
.rtx span{display:block}
.row .rtx small{display:block;margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.3}
.rchev{color:var(--muted);display:flex;flex:none}
.rchev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.swt{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.swt::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.swt.on{background:var(--grad)}
.swt.on::after{transform:translateX(18px)}
.lbl{display:block;color:var(--muted);font-size:14px;margin:6px 2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.hit{padding:10px 12px;margin-bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.hit small{display:block;color:var(--muted)}
.note{color:var(--muted);font-size:14px;margin:8px 2px}

/* Messages area, wallpaper, date lines, scroll button */
#mwrap{flex:1;position:relative;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#wall{position:absolute;inset:-16px;z-index:0;display:none;background-size:cover;background-position:center}
#wall.on{display:block}
#wall::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,var(--dim,0))}
.dsep{align-self:center;margin:10px 0 4px;padding:3px 12px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.load-more{align-self:center;margin:2px 0 10px;padding:7px 16px;font-size:13px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--accent);font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.load-more:disabled{opacity:.6;cursor:default}
#toBottom{position:absolute;right:14px;bottom:12px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:0 4px 16px rgba(40,20,120,.25);display:flex;align-items:center;justify-content:center;cursor:pointer}
#toBottom svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#tbBadge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--grad);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sw{height:64px;border:3px solid transparent;border-radius:16px;color:#fff;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.sw.sel{border-color:var(--text)}
.wprev{position:relative;height:170px;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px}
.wprev .wi{position:absolute;inset:-14px;background-size:cover;background-position:center}
.wprev .wd{position:absolute;inset:0}
.wprev .m{position:relative;z-index:2;cursor:default;max-width:70%}
.sl{display:flex;align-items:center;gap:10px;margin:6px 2px 10px;font-size:14px;color:var(--muted)}
.sl span{width:44px}
.sl input{flex:1;accent-color:var(--accent)}
.fprev{display:flex;flex-direction:column;gap:6px;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.fprev .m{cursor:default}

/* Tabs, feed, profile */
#shell{position:fixed;inset:0;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
#shell>#chat,#shell>.view{flex:1;min-height:0;height:auto;max-width:none;margin:0}
.view{display:flex;flex-direction:column;background:var(--bg)}
#tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
#tabs .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:500;padding:4px 0;cursor:pointer;position:relative}
#tabs .tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs .tab.on{color:var(--accent)}
#tabs .tab.on svg{stroke-width:2.3}
.tbadge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
body.kbd #tabs{display:none}
body:not(.kbd) #chat form{padding-bottom:10px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 8px 10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.vhead h2{font-size:20px;font-weight:600;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.vhead .acts{display:flex;align-items:center;gap:4px}
.vscroll{flex:1;min-height:0;overflow-y:auto;padding:12px}
.pill-new{border:0;border-radius:18px;padding:9px 14px;background:var(--grad);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
.pill-alt{border:1px solid var(--line);border-radius:18px;padding:9px 14px;background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;font-size:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.phead{display:flex;align-items:center;gap:10px;padding:12px 8px 12px 14px}
.phead .meta{flex:1;min-width:0}
.phead b{display:block;font-size:15px}
.phead small{color:var(--muted);font-size:12px}
.pimg{display:block;width:100%;max-height:520px;object-fit:cover;cursor:pointer}
.ptext{padding:12px 14px 4px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.pact{display:flex;gap:20px;padding:8px 14px 12px}
.pact button{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;transition:transform .15s}
.pact button:active{transform:scale(1.18)}
.pact svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pact .liked{color:#e5484d}
.pact .liked svg{fill:#e5484d;animation:likePop .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes likePop{0%{transform:scale(.6)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.pempty{text-align:center;color:var(--muted);padding:44px 20px;line-height:1.5}
.pempty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:14px;font-weight:600;color:var(--muted);cursor:pointer;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.on{background:var(--grad);color:#fff}
.cover{height:150px;border-radius:20px;background:var(--grad) center/cover no-repeat;margin-bottom:-48px}
.ptop{position:relative;display:flex;padding:0 16px;margin-bottom:6px}
.avi.pav{width:96px;height:96px;font-size:36px;border:4px solid var(--bg);box-shadow:var(--shadow);cursor:pointer}
.pname{font-size:22px;font-weight:600;padding:0 4px}
.pstatus{display:inline-block;margin:6px 4px 0;padding:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:13.5px}
.pbio{margin:10px 4px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.pstats{display:flex;gap:18px;margin:10px 4px;color:var(--muted);font-size:14px}
.pstats b{color:var(--text)}
.pbtns{display:flex;gap:8px;margin:12px 4px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px}
.pt{aspect-ratio:1;border-radius:10px;background:var(--surface) center/cover no-repeat;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:8px;font-size:13px;color:var(--muted);overflow:hidden;cursor:pointer;text-align:center;word-break:break-word}
.cprev{position:relative;margin:10px 0}
.cprev img{width:100%;max-height:300px;object-fit:cover;border-radius:16px;display:block}
.cprev button{position:absolute;top:8px;right:8px;border:0;border-radius:50%;width:32px;height:32px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer}
.clist{max-height:50vh;overflow-y:auto;margin-bottom:10px}
.cm{display:flex;gap:10px;padding:6px 4px}
.cm .avi{width:34px;height:34px;font-size:14px;flex:none}
.cm .cb{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 12px;font-size:14.5px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.cm .cb b{display:block;font-size:13px}
.cm .cb small{color:var(--muted);font-size:11.5px}
.cm .cx{border:0;background:none;color:var(--muted);cursor:pointer;align-self:flex-start;padding:4px}
.cinput{display:flex;gap:8px;align-items:center}
.cinput input{flex:1;min-width:0;padding:12px 16px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:22px;outline:none;font:inherit}

.phead .pdots{font-size:24px;padding:6px 12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);z-index:99;background:rgba(20,18,40,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;animation:fadeIn .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:80%;text-align:center}

/* Sheet & lightbox */
#sheet{position:fixed;inset:0;background:rgba(12,8,36,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:70;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sbox{width:100%;max-width:720px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -10px 40px rgba(0,0,0,.28);animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sgroup{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:10px}
.sbox button.opt{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:16px;cursor:pointer;transition:background .15s}
.sgroup button.opt:last-child{border-bottom:0}
.sbox button.opt:active{background:var(--bg)}
.sbox button.opt.danger{color:var(--danger)}
.sbox .ic{color:var(--accent);width:34px;height:34px;border-radius:11px;background:rgba(124,92,245,.13);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;font-style:normal}
.sbox button.opt.danger .ic{background:rgba(229,72,77,.13);color:var(--danger)}
.sbox button.opt.cancel{justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;font-weight:600;margin-top:2px}
.spv{display:flex;flex-direction:column;gap:2px;padding:10px 14px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;font-size:14px}
.spv b{font-size:12.5px;color:var(--accent);font-weight:600}
.spv span{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.rrow{display:flex;justify-content:space-around;padding:8px 6px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow)}
.sinfo{display:flex;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sinfo div{flex:1;padding:8px 6px;text-align:center;font-size:12px;color:var(--muted);border-right:1px solid var(--line)}
.sinfo div:last-child{border-right:0}
.sinfo b{display:block;color:var(--text);font-size:13px;font-weight:600;margin-top:2px}
#dlg{position:fixed;inset:0;z-index:95;background:rgba(12,8,36,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s ease}
.dcard{width:100%;max-width:340px;background:var(--surface);border-radius:26px;padding:24px 20px 16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:slideUp .26s cubic-bezier(.2,.9,.3,1.1)}
.dico{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:rgba(229,72,77,.13);display:flex;align-items:center;justify-content:center;font-size:30px}
.dcard h4{font-size:18px;font-weight:600;margin-bottom:6px}
.dcard p{color:var(--muted);font-size:14.5px;line-height:1.5;margin-bottom:18px}
.dbtns{display:flex;gap:10px}
.dbtns button{flex:1;height:46px;border:0;border-radius:14px;font-weight:600;cursor:pointer;background:var(--bg)}
.dbtns .yes{background:var(--danger);color:#fff}

/* Multi-select */
#selbar{display:none;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 10px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
#chat.selecting #selbar{display:flex}
#chat.selecting header,#chat.selecting form,#chat.selecting #ctx{display:none}
#selbar b{flex:1;font-size:17px;font-weight:600}
#selbar .pill{border:0;border-radius:18px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--text)}
#selbar .pill.del{background:rgba(229,72,77,.14);color:var(--danger)}
#selbar .pill:disabled{opacity:.4}
.sel-on .m::before{content:'';position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--line);z-index:3}
.sel-on .m.sel::before{content:'✓';display:flex;align-items:center;justify-content:center;background:var(--grad);border-color:transparent;color:#fff;font-size:13px;font-weight:700}
.m.sel{outline:2px solid var(--accent);outline-offset:1px}
.ver{padding:10px 14px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.ver small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ver.cur{border-left:3px solid var(--accent)}
.sh-title{font-weight:600;padding:4px 14px 8px}
#light{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:90;display:flex;align-items:center;justify-content:center}
#light img{max-width:100%;max-height:100%}
.lbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;z-index:1}
.lbar button{border:0;border-radius:22px;padding:9px 16px;background:rgba(255,255,255,.18);color:#fff;font-size:15px;cursor:pointer}

/* ===== Design, themes, animations, fonts ===== */
:root{--font:'Inter';--g1:#8b5cf6;--g2:#5b8def;--rad:20px;--gap:6px;--pad:8px 12px}
:root[data-amoled="1"]{--surface:#0b0b0f;--theirs:#17171d;--line:#1b1b23}
body{font-family:var(--font),'Hind Siliguri','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#msgs{gap:var(--gap)}
.m{border-radius:var(--rad);padding:var(--pad)}
[data-bubble="sharp"]{--rad:6px}
[data-bubble="sharp"] .m.me{border-bottom-right-radius:2px}
[data-bubble="sharp"] .m.them{border-bottom-left-radius:2px}
[data-bubble="minimal"]{--rad:14px}
[data-bubble="minimal"] .m{box-shadow:none}
[data-bubble="minimal"] .m.them{border:1px solid var(--line)}
[data-bubble="tail"]{--rad:18px}
[data-bubble="tail"] .m.me,[data-bubble="tail"] .m.them{border-radius:18px}
[data-bubble="tail"] .m.me:not(.has-img):not(.jumbo):not(.stk)::after{content:'';position:absolute;right:-6px;bottom:0;width:12px;height:14px;background:var(--g2);clip-path:polygon(0 0,0 100%,100% 100%)}
[data-bubble="tail"] .m.them:not(.has-img):not(.jumbo):not(.stk)::after{content:'';position:absolute;left:-6px;bottom:0;width:12px;height:14px;background:var(--theirs);clip-path:polygon(100% 0,100% 100%,0 100%)}
[data-density="compact"]{--gap:2px;--pad:5px 10px}
[data-density="roomy"]{--gap:12px;--pad:11px 15px}
.m.jumbo{background:none!important;box-shadow:none!important;border:0!important;font-size:48px;line-height:1.1;padding:2px 6px;color:inherit}
.m.jumbo .t{float:none;display:flex;justify-content:flex-end;margin:2px 0 0;color:var(--muted)}
.m.pop{animation:popm .28s cubic-bezier(.2,.9,.3,1.25)}
@keyframes popm{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
#shell>#chat,#shell>.view{animation:tabIn .24s ease}
@keyframes tabIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.flyh{position:fixed;z-index:90;pointer-events:none;font-size:22px;animation:flyh 1s ease-out forwards}
@keyframes flyh{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-140px) scale(1.2)}}
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#6d4be8,#4f7cf0);color:#fff;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .sl{width:88px;height:88px;border-radius:28px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;animation:pulse 1.4s ease-in-out infinite}
#splash .sl svg{width:50px;height:50px}
#splash b{font-size:22px;font-weight:600;letter-spacing:.3px}
#splash .dots{display:flex;gap:7px}
#splash .dots i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.4;animation:dotb 1s ease-in-out infinite}
#splash .dots i:nth-child(2){animation-delay:.15s}#splash .dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dotb{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
#offbar{background:#f59e0b;color:#1d1b2e;text-align:center;font-size:13px;font-weight:600;padding:5px 10px}
.skel{height:190px;margin-bottom:14px;border-radius:20px;background:linear-gradient(100deg,var(--surface) 30%,var(--line) 50%,var(--surface) 70%);background-size:300% 100%;animation:shim 1.3s linear infinite;border:1px solid var(--line)}
.skel-m{height:44px;border-radius:18px;margin-bottom:8px;background:linear-gradient(100deg,var(--surface) 30%,var(--line) 50%,var(--surface) 70%);background-size:300% 100%;animation:shim 1.3s linear infinite;border:1px solid var(--line)}
.skel-m.me{align-self:flex-end;width:58%}
.skel-m.them{align-self:flex-start;width:66%}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.pempty svg.art{width:150px;height:110px;display:block;margin:0 auto 12px}

/* Wallpapers */
#wall.flow{background-size:300% 300%!important;animation:flowbg 16s ease infinite}
@keyframes flowbg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#wall .fx{position:absolute;display:block;pointer-events:none;will-change:transform,opacity;font-style:normal;color:rgba(255,255,255,.7);line-height:1}
#wall .fx-hearts{bottom:-30px;animation:riseh linear infinite}
#wall .fx-hearts::before{content:'❤'}
#wall .fx-petals{top:-30px;animation:fallp linear infinite}
#wall .fx-petals::before{content:'🌸'}
#wall .fx-stars{width:3px;height:3px;border-radius:50%;background:#fff;animation:twk ease-in-out infinite}
#wall .fx-rain{top:-40px;width:1.5px;height:26px;background:linear-gradient(transparent,rgba(255,255,255,.75));animation:fallr linear infinite}
#wall .fx-snow{top:-12px;width:7px;height:7px;border-radius:50%;background:#fff;opacity:.85;animation:fallp linear infinite}
#wall .fx-bubbles{bottom:-40px;border:2px solid rgba(255,255,255,.6);border-radius:50%;animation:riseb linear infinite}
#wall .fx-moon{position:absolute;top:34px;right:34px;width:58px;height:58px;border-radius:50%;box-shadow:inset -15px 0 0 0 #fff4c2;transform:rotate(-20deg)}
@keyframes riseh{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.8}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@keyframes riseb{0%{transform:translateY(0);opacity:0}10%{opacity:.8}100%{transform:translateY(-115vh);opacity:0}}
@keyframes fallp{0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translateY(115vh) translateX(40px) rotate(180deg);opacity:0}}
@keyframes fallr{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(115vh);opacity:.2}}
@keyframes twk{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){#wall .fx,#wall.flow,.m.pop,#splash .sl,.flyh{animation:none}}
.wtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 14px}
.wt{height:84px;border:3px solid transparent;border-radius:16px;color:#fff;font-weight:600;font-size:12.5px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;text-shadow:0 1px 3px rgba(0,0,0,.45);position:relative}
.wt.sel{border-color:var(--text)}
.wt .fxb{position:absolute;top:6px;right:8px;font-size:13px}
.cpick{display:flex;gap:12px;margin:6px 0 14px}
.cpick label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.cpick input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:3px}
.lkprev{display:flex;flex-direction:column;gap:var(--gap);padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.lkprev .m{cursor:default}
.fontprev{font-size:17px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;text-align:center;color:var(--text)}

/* Extra controls */
.icon.plus{font-size:26px;padding:6px 12px}
.send.mic svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header .acts{display:flex;align-items:center;gap:0;flex:none}
#recbar{display:none;align-items:center;gap:10px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--surface);border-top:1px solid var(--line)}
#chat.recording form{display:none}
#chat.recording #recbar{display:flex}
.rdot{width:12px;height:12px;border-radius:50%;background:#ef4444;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
#recT{font-variant-numeric:tabular-nums;font-weight:600}
.rhint{flex:1;color:var(--muted);font-size:13px}
#pinbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);cursor:pointer}
.pill-alt.sm,.pill-new.sm{padding:7px 12px;font-size:13px;white-space:nowrap}
/* Pinbar, Star, Vanish */
#pinbar .pi{font-size:18px;flex:none}
#pinbar .pt2{flex:1;min-width:0}
#pinbar b{display:block;font-size:12px;color:var(--accent)}
#pinbar span.s{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pinbar .px{border:0;background:none;color:var(--muted);font-size:16px;padding:4px 8px;cursor:pointer}
.stmk{margin-right:3px;font-size:11px}
.vmk{margin-right:4px;font-size:11px;font-weight:600;color:#fbbf24}
.m.them .vmk{color:var(--accent)}
#vbar{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 14px;background:rgba(124,92,245,.1);border-top:1px solid var(--line);font-size:13px;color:var(--accent);font-weight:500}
#vbar span{flex:1}
#vbar button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:2px 8px}

/* Voice messages */
.m.voice{min-width:215px}
.vp{display:flex;align-items:center;gap:10px;min-width:195px;padding:2px 0}
.vbtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer}
.m.them .vbtn{background:rgba(124,92,245,.15);color:var(--accent)}
.vbtn svg{width:18px;height:18px;fill:currentColor;stroke:none}
.vbar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.32);overflow:hidden;cursor:pointer}
.m.them .vbar{background:var(--line)}
.vbar i{display:block;height:100%;width:0;background:currentColor;transition:width .1s linear}
.vtime{font-size:12px;font-variant-numeric:tabular-nums;opacity:.88}

/* Stickers */
.m.stk{background:none!important;box-shadow:none!important;border:0!important;padding:2px;max-width:none}
.m.stk .pic{width:140px;height:140px;border-radius:14px;object-fit:contain;max-height:none}
.m.stk .t{float:none;position:static;display:flex;justify-content:flex-end;margin:2px 0 0;background:none;color:var(--muted);padding:0}
.stkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 2px 10px;max-height:46vh;overflow-y:auto}
.stkgrid button{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:4px;cursor:pointer;overflow:hidden}
.stkgrid button img{width:100%;height:100%;object-fit:contain;display:block}
.stkgrid .stkadd{font-size:28px;color:var(--accent);font-weight:600}
.stkgrid .stkdel{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(229,72,77,.9);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;line-height:1}

/* Doodle canvas */
#doodle{position:fixed;inset:0;z-index:75;display:flex;flex-direction:column;background:var(--bg);max-width:720px;margin:0 auto}
.dd-top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.dd-acts{display:flex;align-items:center;gap:4px}
#ddCanvas{flex:1;min-height:0;width:100%;background:#ffffff;touch-action:none;display:block;cursor:crosshair}
.dd-tools{display:flex;align-items:center;gap:10px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--surface);border-top:1px solid var(--line);overflow-x:auto}
.dd-tools .cs{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.dd-tools .cs.sel{border-color:var(--text);transform:scale(1.1)}
.dd-tools .sz{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.dd-tools .sz.sel{border-color:var(--accent);background:rgba(124,92,245,.15)}

const ms = t => t ? t.toMillis() : Date.now();
const ST = { serverTimestamps: 'estimate' };

      }

  }, e => console.error(e)));

    profData[u] = s.exists() ? s.data() : {}; profiles[u] = profData[u].photo || ''; applyAvatars(); refreshTabs();

function mergeMsgs() {
  const map = new Map();
  olderMsgs.forEach(m => map.set(m.id, m));
  liveMsgs.forEach(m => map.set(m.id, m));
  msgs = [...map.values()].sort((a, b) => ms(a.createdAt) - ms(b.createdAt));
}

async function loadOlderMsgs() {
  if (!me || loadingOlder || !hasMoreMsgs || !oldestSnap) return;
  loadingOlder = true;
  const btn = $('loadOlderBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  try {
    const snap = await getDocs(query(collection(db, 'messages'), orderBy('createdAt', 'desc'), startAfter(oldestSnap), limit(200)));
    if (snap.docs.length) {
      oldestSnap = snap.docs[snap.docs.length - 1];
      const batch = snap.docs.map(d => ({ id: d.id, ...d.data(ST), pending: false })).reverse();
      batch.forEach(m => { notifSeen.add(m.id); known.add(m.id); renderedIds.add(m.id); });
      olderMsgs = [...batch, ...olderMsgs];
      hasMoreMsgs = snap.docs.length >= 200;
      mergeMsgs();
      prepending = true;
      render();
      prepending = false;
    } else {
      hasMoreMsgs = false;
      render();
    }
  } catch (e) {
    console.error(e);
    toast('Could not load older messages');
  }
  loadingOlder = false;
  const b2 = $('loadOlderBtn');
  if (b2) { b2.disabled = false; b2.textContent = '↑ Load older messages'; }
}

function visibleMsgs() {
  return msgs.filter(m => !(m.hiddenFor || []).includes(me.uid) && ms(m.createdAt) > clearedAt);
}

function markReceived() {
  if (!me || !msgs.length) return;
  const seen = document.visibilityState === 'visible' && curTab === 'chat';
  const batch = writeBatch(db); let n = 0;
  for (const m of msgs) {
    if (m.uid === me.uid || m.pending) continue;
    const u = {};
    if (!m.deliveredAt) u.deliveredAt = serverTimestamp();
    if (seen && !m.seenAt) u.seenAt = serverTimestamp();
    if (Object.keys(u).length) { batch.update(doc(db, 'messages', m.id), u); n++; }
  }
  if (n) batch.commit().catch(e => console.error(e));
}

function squarePhoto(file, size = 256) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      const c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      let q = 0.82, out = c.toDataURL('image/jpeg', q);
      while (out.length > 150000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url);
      out.length > 190000 ? rej(new Error('big')) : res(out);
    };
    img.onerror = rej; img.src = url;
  });
}

function wallpaperUrl(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let sc = Math.min(1, 1280 / Math.max(img.width, img.height));
      for (let attempt = 0; attempt < 4; attempt++) {
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        for (let q = 0.72; q >= 0.4; q -= 0.08) {
          const out = c.toDataURL('image/jpeg', q);
          if (out.length <= 280000) { URL.revokeObjectURL(url); res(out); return; }
        }
        sc *= 0.8;
      }
      URL.revokeObjectURL(url); rej(new Error('big'));
    };
    img.onerror = rej; img.src = url;
  });
}

            olderMsgs = needed;
            if (searchDocs && searchDocs.length) {

              if (docIdx !== -1) oldestSnap = searchDocs[docIdx];

const PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE_SVG = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
function stopCurAudio() {
  if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio = null; }
  if (curPlayBtn) { curPlayBtn.innerHTML = PLAY_SVG; curPlayBtn = null; }
  if (curPlayBar) { curPlayBar.style.width = '0%'; curPlayBar = null; }
}
function toggleVoicePlay(m, btn, fill, timeEl) {
  if (curAudio && curPlayBtn === btn) { stopCurAudio(); timeEl.textContent = fmtDur(m.audioDur); return; }
  stopCurAudio();
  const a = new Audio(m.audio);
  curAudio = a; curPlayBtn = btn; curPlayBar = fill;
  btn.innerHTML = PAUSE_SVG;
  a.ontimeupdate = () => {
    const d = a.duration && isFinite(a.duration) ? a.duration : (m.audioDur || 1);
    fill.style.width = Math.min(100, (a.currentTime / d) * 100) + '%';
    timeEl.textContent = fmtDur(a.currentTime);
  };
  a.onended = () => { stopCurAudio(); timeEl.textContent = fmtDur(m.audioDur); };
  a.onerror = () => { stopCurAudio(); toast('Could not play audio'); };
  a.play().catch(() => { stopCurAudio(); toast('Could not play audio'); });
}

let mediaRec = null, recChunks = [], recStream = null, recStart = 0, recInt = null, recDiscard = false;
function cleanupRec() {
  clearInterval(recInt); recInt = null;
  if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  mediaRec = null; recChunks = [];
  $('chat').classList.remove('recording');
}
async function startVoiceRec() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Voice recording is not supported in this browser.'); return;
  }
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
    const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    mediaRec = new MediaRecorder(recStream, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 });
    recChunks = []; recDiscard = false; recStart = Date.now();
    $('recT').textContent = '0:00';
    $('chat').classList.add('recording');
    if (navigator.vibrate) navigator.vibrate(15);
    mediaRec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = () => {
      const dur = Math.max(1, Math.round((Date.now() - recStart) / 1000));
      const blob = new Blob(recChunks, { type: mediaRec?.mimeType || 'audio/webm' });
      const discard = recDiscard;
      cleanupRec();
      if (discard || blob.size < 200) return;
      if (blob.size > 650000) { alert('Voice message is too long. Try keeping it under 50 seconds.'); return; }
      const fr = new FileReader();
      fr.onload = () => {
        const rt = replyTo; clearCtx();
        send('', null, rt, { audio: fr.result, audioDur: dur });
      };
      fr.readAsDataURL(blob);
    };
    mediaRec.start();
    recInt = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      $('recT').textContent = fmtDur(s);
      if (s >= 60 && mediaRec && mediaRec.state === 'recording') mediaRec.stop();
    }, 300);
  } catch (e) {
    cleanupRec();
    alert('Microphone permission is needed to record voice messages.');
  }
}
$('micBtn').onclick = startVoiceRec;
$('recX').onclick = () => { recDiscard = true; if (mediaRec && mediaRec.state === 'recording') mediaRec.stop(); else cleanupRec(); };
$('recSend').onclick = () => { recDiscard = false; if (mediaRec && mediaRec.state === 'recording') mediaRec.stop(); };

/* --- 4. Doodle (Hand-drawn note) --- */
const DD_COLORS = ['#1d1b2e', '#e5484d', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899'];
const DD_SIZES = [3, 7, 14];
let ddStrokes = [], ddCur = null, ddColor = DD_COLORS[0], ddSize = 7, ddEraser = false, ddCtx = null;

function ddRedraw() {
  const c = $('ddCanvas'); if (!ddCtx) return;
  ddCtx.fillStyle = '#ffffff';
  ddCtx.fillRect(0, 0, c.width, c.height);
  ddCtx.lineCap = 'round'; ddCtx.lineJoin = 'round';
  for (const s of ddStrokes) {
    if (!s.pts.length) continue;
    ddCtx.strokeStyle = s.er ? '#ffffff' : s.col;
    ddCtx.lineWidth = s.sz;
    ddCtx.beginPath();
    ddCtx.moveTo(s.pts[0][0], s.pts[0][1]);
    for (let i = 1; i < s.pts.length; i++) ddCtx.lineTo(s.pts[i][0], s.pts[i][1]);
    if (s.pts.length === 1) ddCtx.lineTo(s.pts[0][0] + 0.1, s.pts[0][1]);
    ddCtx.stroke();
  }
}
function renderDdTools() {
  const t = $('ddTools'); t.innerHTML = '';
  DD_COLORS.forEach(col => {
    const b = el('button', 'cs' + (!ddEraser && ddColor === col ? ' sel' : '')); b.type = 'button';
    b.style.background = col;
    b.onclick = () => { ddColor = col; ddEraser = false; renderDdTools(); };
    t.appendChild(b);
  });
  DD_SIZES.forEach(sz => {
    const b = el('button', 'sz' + (ddSize === sz ? ' sel' : '')); b.type = 'button';
    const dot = el('i'); dot.style.width = dot.style.height = (sz + 4) + 'px'; b.appendChild(dot);
    b.onclick = () => { ddSize = sz; renderDdTools(); };
    t.appendChild(b);
  });
  const er = el('button', 'er' + (ddEraser ? ' sel' : ''), 'Eraser'); er.type = 'button';
  er.onclick = () => { ddEraser = !ddEraser; renderDdTools(); };
  t.appendChild(er);
}
function openDoodle() {
  $('doodle').classList.remove('hidden');
  ddStrokes = []; ddCur = null; ddEraser = false;
  renderDdTools();
  const c = $('ddCanvas'), r = c.getBoundingClientRect();
  c.width = Math.max(300, Math.round(r.width));
  c.height = Math.max(300, Math.round(r.height));
  ddCtx = c.getContext('2d');
  ddRedraw();
}
const ddPos = e => { const r = $('ddCanvas').getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
$('ddCanvas').addEventListener('pointerdown', e => {
  e.preventDefault(); $('ddCanvas').setPointerCapture(e.pointerId);
  ddCur = { col: ddColor, sz: ddEraser ? ddSize * 2.2 : ddSize, er: ddEraser, pts: [ddPos(e)] };
  ddStrokes.push(ddCur); ddRedraw();
});
$('ddCanvas').addEventListener('pointermove', e => {
  if (!ddCur) return;
  ddCur.pts.push(ddPos(e)); ddRedraw();
});
['pointerup', 'pointercancel'].forEach(ev => $('ddCanvas').addEventListener(ev, () => { ddCur = null; }));
$('ddX').onclick = () => $('doodle').classList.add('hidden');
$('ddUndo').onclick = () => { ddStrokes.pop(); ddRedraw(); };
$('ddClear').onclick = () => { ddStrokes = []; ddRedraw(); };
$('ddSend').onclick = () => {
  if (!ddStrokes.length) { toast('Draw something first'); return; }
  const out = $('ddCanvas').toDataURL('image/jpeg', 0.78);
  $('doodle').classList.add('hidden');
  const rt = replyTo; clearCtx();
  send('', out, rt);
};

/* --- 5. Custom Stickers --- */
function stickerImg(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 240 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let out = c.toDataURL('image/webp', 0.8);
      if (!out.startsWith('data:image/webp') || out.length > 90000) out = c.toDataURL('image/jpeg', 0.72);
      URL.revokeObjectURL(url);
      out.length > 140000 ? rej(new Error('big')) : res(out);
    };
    img.onerror = rej; img.src = url;
  });
}
function openStickers() {
  const sh = $('sheet'); sh.innerHTML = '';
  const box = el('div', 'sbox'); box.appendChild(el('div', 'grab'));
  box.appendChild(el('div', 'sh-title', 'Custom stickers'));
  const grid = el('div', 'stkgrid');
  const f = el('input'); f.type = 'file'; f.accept = 'image/*'; f.className = 'hidden';
  f.onchange = async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    try {
      const img = await stickerImg(file);
      await addDoc(collection(db, 'stickers'), { img, uid: me.uid, createdAt: serverTimestamp() });
      toast('Sticker added');
      setTimeout(openStickers, 250);
    } catch (err) { alert('Could not add that sticker.'); console.error(err); }
  };
  box.appendChild(f);
  const addB = el('button', 'stkadd', '＋'); addB.type = 'button'; addB.title = 'Add sticker';
  addB.onclick = () => f.click();
  grid.appendChild(addB);
  stickers.forEach(s => {
    const b = el('button'); b.type = 'button';
    const im = el('img'); im.src = s.img; im.alt = 'Sticker'; b.appendChild(im);
    const dx = el('span', 'stkdel', '✕');
    dx.onclick = ev => {
      ev.stopPropagation();
      if (confirm('Delete this sticker?')) deleteDoc(doc(db, 'stickers', s.id)).then(() => setTimeout(openStickers, 200)).catch(console.error);
    };
    b.appendChild(dx);
    b.onclick = () => { closeSheet(); const rt = replyTo; clearCtx(); send('', s.img, rt, { isSticker: true }); };
    grid.appendChild(b);
  });
  box.appendChild(grid);
  if (!stickers.length) box.appendChild(el('div', 'note', 'Tap ＋ to turn any photo into a custom sticker for both of you.'));
  const c = el('button', 'opt cancel', 'Close'); c.onclick = closeSheet; box.appendChild(c);
  sh.appendChild(box); sh.classList.remove('hidden');
  sh.onclick = e => { if (e.target === sh) closeSheet(); };
}

/* --- 6. Vanish (Disappearing) Messages --- */
function updateVanishBar() {
  $('vbar').classList.toggle('hidden', !vanishSec);
  if (vanishSec) $('vbarTxt').textContent = '⏱️ Vanish mode · disappears ' + vanishSec + 's after seen';
}
$('vbarOff').onclick = () => { vanishSec = 0; updateVanishBar(); };
function openVanishPicker() {
  const h = el('div'), pv = el('div', 'spv');
  pv.appendChild(el('b', '', 'Vanish message'));
  pv.appendChild(el('span', '', 'Messages sent in vanish mode automatically delete themselves after being seen.'));
  h.appendChild(pv);
  const opts = [[0, 'Off'], [10, '10 seconds after seen'], [30, '30 seconds after seen'], [60, '1 minute after seen']];
  sheet(opts.map(([s, l]) => ({
    label: l,
    icon: vanishSec === s ? 'radioOn' : 'radioOff',
    fn: () => { vanishSec = s; updateVanishBar(); toast(s ? 'Vanish mode: ' + s + 's' : 'Vanish mode off'); }
  })), h);
}
const wipingVanish = new Set();
function checkVanish() {
  if (!me || !msgs.length) return;
  const now = Date.now();
  for (const m of msgs) {
    if (m.deleted || !m.vanishSec || !m.seenAt) continue;
    const rem = Math.ceil((ms(m.seenAt) + m.vanishSec * 1000 - now) / 1000);
    const badge = document.querySelector('.vmk[data-vid="' + m.id + '"]');
    if (badge) badge.textContent = '⏱ ' + Math.max(0, rem) + 's';
    if (rem <= 0 && !wipingVanish.has(m.id)) {
      wipingVanish.add(m.id);
      updateDoc(doc(db, 'messages', m.id), WIPE()).catch(() => wipingVanish.delete(m.id));
    }
  }
}

/* --- 7. Quick Hide / Panic Button (Fake Calculator) --- */
let cBuf = '0', cOp = null, cAcc = null, cFresh = true, cHoldTimer = null;
function updateCalc() {
  $('cVal').textContent = cBuf;
  $('cExpr').textContent = cAcc !== null && cOp ? (cAcc + ' ' + cOp) : '';
}
function triggerPanic() {
  stopCurAudio(); hideRbar(); closeSheet(); closeLight();
  const mode = store.get('panic_mode') || 'calc';
  if (mode === 'lock' && store.get('pinhash')) { lockIfNeeded(); return; }
  cBuf = '0'; cOp = null; cAcc = null; cFresh = true; updateCalc();
  $('decoy').classList.remove('hidden');
}
$('panicBtn').onclick = triggerPanic;
let lastEsc = 0;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && me) {
    if (Date.now() - lastEsc < 500) triggerPanic();
    lastEsc = Date.now();
  }
});
$('cGrid').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.k;
  if (/^\d$/.test(k)) { cBuf = (cFresh || cBuf === '0') ? k : (cBuf.length < 12 ? cBuf + k : cBuf); cFresh = false; }
  else if (k === '.') { if (cFresh) { cBuf = '0.'; cFresh = false; } else if (!cBuf.includes('.')) cBuf += '.'; }
  else if (k === 'C') { cBuf = '0'; cOp = null; cAcc = null; cFresh = true; }
  else if (k === '±') { cBuf = String(-parseFloat(cBuf || '0')); }
  else if (k === '%') { cBuf = String(parseFloat(cBuf || '0') / 100); }
  else if (['+', '-', '×', '÷'].includes(k)) { cAcc = parseFloat(cBuf || '0'); cOp = k; cFresh = true; }
  else if (k === '=') {
    if (cOp && cAcc !== null) {
      const b2 = parseFloat(cBuf || '0');
      let res = b2;
      if (cOp === '+') res = cAcc + b2;
      else if (cOp === '-') res = cAcc - b2;
      else if (cOp === '×') res = cAcc * b2;
      else if (cOp === '÷') res = b2 === 0 ? 0 : cAcc / b2;
      cBuf = String(Number(res.toFixed(8)));
      cAcc = null; cOp = null; cFresh = true;
    }
  }
  updateCalc();
};
/* Long-press 'C' button for 0.8s to exit Fake Calculator */
$('cClearBtn').addEventListener('pointerdown', () => {
  clearTimeout(cHoldTimer);
  cHoldTimer = setTimeout(() => {
    $('decoy').classList.add('hidden');
    if (navigator.vibrate) navigator.vibrate(20);
  }, 800);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('cClearBtn').addEventListener(ev, () => clearTimeout(cHoldTimer)));

function showPanicSettings() {
  const b = setView('panic', 'Quick hide / Panic button');
  const cur = store.get('panic_mode') || 'calc';
  b.appendChild(el('div', 'note', 'Tap the 🛡️ icon at the top of the chat anytime to instantly hide your chat.'));
  const g = el('div', 'sgrp');
  g.appendChild(row(cur === 'calc' ? 'radioOn' : 'radioOff', 'Fake Calculator (Recommended)', () => { store.set('panic_mode', 'calc'); showPanicSettings(); }, 'Opens a working calculator screen', false, true));
  g.appendChild(row(cur === 'lock' ? 'radioOn' : 'radioOff', 'Instant PIN Lock', () => {
    if (!store.get('pinhash')) { alert('Turn on App Lock (PIN) first to use this mode.'); return; }
    store.set('panic_mode', 'lock'); showPanicSettings();
  }, 'Locks the app with your PIN', false, true));
  b.appendChild(g);
  const c = el('div', 'card'); c.style.marginTop = '12px';
  c.appendChild(el('small', '', 'How to return from Fake Calculator'));
  c.appendChild(el('div', '', 'Press and hold the “C” button on the calculator for 1 second to return to your chat.'));
  b.appendChild(c);
  const test = el('button', 'primary', 'Try Quick Hide now'); test.style.marginTop = '8px';
  test.onclick = () => { closePanel(); triggerPanic(); };
  b.appendChild(test);
}

/* --- 8. Chat Backup (Export Chat) --- */
function openExportSheet() {
  const h = el('div'), pv = el('div', 'spv');
  pv.appendChild(el('b', '', 'Export chat backup'));
  pv.appendChild(el('span', '', 'Downloads your full chat history from the cloud to this phone.'));
  h.appendChild(pv);
  sheet([
    { label: 'Readable text file (.txt)', icon: 'download', fn: () => exportChat('txt') },
    { label: 'Full data backup (.json)', icon: 'download', fn: () => exportChat('json') }
  ], h);
}
async function exportChat(fmt) {
  toast('Preparing backup…');
  try {
    const snap = await getDocs(query(collection(db, 'messages'), orderBy('createdAt', 'asc')));
    const all = snap.docs
      .map(d => ({ id: d.id, ...d.data(ST) }))
      .filter(m => !(m.hiddenFor || []).includes(me.uid) && ms(m.createdAt) > clearedAt);
    const stamp = new Date().toISOString().slice(0, 10);
    let blob, fname;
    if (fmt === 'json') {
      const clean = all.map(m => ({
        id: m.id,
        sender: m.uid === me.uid ? (nick[me.uid] || 'You') : themName(),
        time: new Date(ms(m.createdAt)).toISOString(),
        text: m.deleted ? '[Deleted]' : (m.text || ''),
        hasPhoto: !!m.image,
        hasVoice: !!m.audio,
        reactions: m.reactions || {}
      }));
      blob = new Blob([JSON.stringify(clean, null, 2)], { type: 'application/json;charset=utf-8' });
      fname = 'our-chat-backup-' + stamp + '.json';
    } else {
      const lines = ['Our Chat Backup (' + stamp + ')', 'Total messages: ' + all.length, '====================================', ''];
      all.forEach(m => {
        const who = m.uid === me.uid ? (nick[me.uid] || 'You') : themName();
        const dt = new Date(ms(m.createdAt)).toLocaleString('en-US');
        let body = m.deleted ? '[Deleted message]'
          : m.audio ? '[Voice message · ' + fmtDur(m.audioDur) + ']'
          : m.isSticker ? '[Sticker]'
          : m.image ? '[Photo]' + (m.text ? ' ' + m.text : '')
          : (m.text || '');
        if (m.edited && !m.deleted) body += ' (edited)';
        lines.push('[' + dt + '] ' + who + ': ' + body);
      });
      blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      fname = 'our-chat-backup-' + stamp + '.txt';
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Backup saved (' + all.length + ' messages)');
  } catch (e) {
    console.error(e);
    alert('Could not export chat backup.');
  }
}
